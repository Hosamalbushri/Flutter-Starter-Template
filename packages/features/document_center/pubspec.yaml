version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Workspace packages.
  app_ui: ^0.1.0
  localization: ^0.1.0
  document_engine: ^0.1.0
  shared_contracts: ^0.1.0

  # Third-party.
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  injectable: ^3.0.0
  get_it: ^9.3.0
  printing: ^5.15.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.0
  injectable_generator: ^3.1.3
